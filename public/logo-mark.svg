<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Anglo Club">
  <defs>
    <linearGradient id="ring" x1="14" y1="6" x2="114" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4d2c80" />
      <stop offset="1" stop-color="#241340" />
    </linearGradient>
    <linearGradient id="sea" x1="28" y1="20" x2="102" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e7490" />
      <stop offset="0.55" stop-color="#1d4ed8" />
      <stop offset="1" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="gold" x1="28" y1="102" x2="102" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c98a1f" />
      <stop offset="0.5" stop-color="#f8d477" />
      <stop offset="1" stop-color="#e0a62e" />
    </linearGradient>
    <clipPath id="disc">
      <circle cx="64" cy="62" r="47" />
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#06122a" flood-opacity="0.55" />
    </filter>
  </defs>

  <circle cx="64" cy="62" r="54" fill="url(#ring)" />

  <g clip-path="url(#disc)">
    <rect x="17" y="15" width="94" height="94" fill="url(#sea)" />
    <g stroke-linecap="square">
      <path d="M17 15 L111 109" stroke="#ffffff" stroke-width="13" />
      <path d="M111 15 L17 109" stroke="#ffffff" stroke-width="13" />
      <path d="M17 15 L111 109" stroke="#d81f3f" stroke-width="6" />
      <path d="M111 15 L17 109" stroke="#d81f3f" stroke-width="6" />
      <rect x="17" y="54" width="94" height="16" fill="#ffffff" />
      <rect x="56" y="15" width="16" height="94" fill="#ffffff" />
      <rect x="17" y="58" width="94" height="8" fill="#d81f3f" />
      <rect x="60" y="15" width="8" height="94" fill="#d81f3f" />
    </g>
  </g>

  <!-- Flèche dorée derrière le A : elle suggère le progrès sans masquer la lettre. -->
  <g filter="url(#soft)">
    <path
      d="M32 106 C54 96 74 76 88 50"
      fill="none"
      stroke="url(#gold)"
      stroke-width="8.5"
      stroke-linecap="round"
    />
    <path d="M103 25 L79 46 L95 55 Z" fill="url(#gold)" />
    <path d="M103 93 L91 103 L104 107 Z" fill="url(#gold)" />
  </g>

  <g filter="url(#soft)">
    <path d="M64 24 L90 94 H77.4 L71.5 78 H56.5 L50.6 94 H38 Z" fill="#ffffff" />
    <path d="M60.8 65 H67.2 L64 55 Z" fill="#d81f3f" />
  </g>

  <circle cx="64" cy="62" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" />
</svg>
